
name: SPOM availability monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Send only an ntfy test notification (no portal checks)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: spom-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check all centres and dates
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TEST_ONLY: ${{ inputs.test_only }}
          COUNTRY_SELECTOR: ${{ vars.COUNTRY_SELECTOR }}
          STATE_SELECTOR: ${{ vars.STATE_SELECTOR }}
          CITY_SELECTOR: ${{ vars.CITY_SELECTOR }}
          TEST_CENTRE_SELECTOR: ${{ vars.TEST_CENTRE_SELECTOR }}
          EXAM_DATE_SELECTOR: ${{ vars.EXAM_DATE_SELECTOR }}
          RESULT_SELECTOR: ${{ vars.RESULT_SELECTOR }}
        run: |
          if [ "$TEST_ONLY" = "true" ]; then
            python bot.py --test-notification
          else
            python bot.py
          fi
      - name: Save alert state
        if: always()
        run: |
          if [ -f state/slots.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/slots.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update SPOM alert state [skip ci]'
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spom-diagnostics
          path: diagnostics/
          retention-days: 3
